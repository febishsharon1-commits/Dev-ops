<script>

      document.body ? document.body.prepend(d) : document.documentElement.appendChild(d);

    })();
    b.style.display = 'block';
    b.textContent = (b.textContent ? b.textContent + '\n\n' : '') + msg;

</script>

/* LOCAL STORAGE SHIM (mimics the Claude-artifact storage API)       */
/* ---------------------------------------------------------------- */

const storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("Key not found: " + key);
    return { key, value: v, shared: false };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value, shared: false };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true, shared: false };
  },
};

function MiniLineChart({ data, color, height = 160 }) {
  const w = 300, h = 100;
  const pts = data.map((d, idx) => {
    const x = data.length > 1 ? (idx / (data.length - 1)) * w : w / 2;
    const y = h - (Math.max(0, Math.min(100, d.v)) / 100) * h;
    return `${x},${y}`;
  }).join(" ");
  const last = data[data.length - 1];
  const lastX = w;
  const lastY = h - (Math.max(0, Math.min(100, last.v)) / 100) * h;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height }} preserveAspectRatio="none">
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2.5" />
      <circle cx={lastX} cy={lastY} r="3.5" fill={color} />
    </svg>
  );
}

function MiniRadarChart({ data, size = 280 }) {
  const n = data.length;
  const cx = size / 2, cy = size / 2, r = size * 0.32;
  const angle = (i) => (i / n) * Math.PI * 2 - Math.PI / 2;
  const pointFor = (value, i) => {
    const rad = r * (Math.max(0, Math.min(100, value)) / 100);
    const a = angle(i);
    return [cx + Math.cos(a) * rad, cy + Math.sin(a) * rad];
  };
  const currentPts = data.map((d, i) => pointFor(d.current, i).join(",")).join(" ");
  const comparePts = data.map((d, i) => pointFor(d.compare, i).join(",")).join(" ");
  const rings = [0.25, 0.5, 0.75, 1];
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", height: size }}>
      {rings.map((f) => <circle key={f} cx={cx} cy={cy} r={r * f} fill="none" stroke={C.hairline} strokeWidth="1" />)}
      {data.map((d, i) => { const [x, y] = pointFor(100, i); return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={C.hairline} strokeWidth="1" />; })}
      <polygon points={comparePts} fill={C.textTertiary} fillOpacity="0.12" stroke={C.textTertiary} strokeWidth="1.5" />
      <polygon points={currentPts} fill={C.signal} fillOpacity="0.28" stroke={C.signal} strokeWidth="1.5" />
      {data.map((d, i) => { const [x, y] = pointFor(112, i); return <text key={i} x={x} y={y} fontSize="9" fill={C.textSecondary} textAnchor="middle">{d.dimension}</text>; })}
    </svg>
  );
}

function isoDaysAgo(n) { return new Date(Date.now() - n * 86400000).toISOString(); }

/* ---------------------------------------------------------------- */
/* SCORING — evidence based, diminishing returns, gentle decay         */
/* ---------------------------------------------------------------- */

function scoreAsOf(dimKey, cutoffISO, log) {
  const cutoff = new Date(cutoffISO).getTime();
  let weighted = 0;
  for (const e of log) {
    if (!e.dims || !e.dims.includes(dimKey)) continue;
    const t = new Date(e.ts).getTime();
    if (t > cutoff) continue;
    const ageDays = (cutoff - t) / 86400000;
    const halfLife = 45;
    weighted += Math.pow(0.5, ageDays / halfLife);
  }
  if (weighted <= 0) return 50;
  const score = 50 + 8 * Math.log2(1 + weighted);
  return Math.max(1, Math.min(99, Math.round(score)));
}
function dayScoreFor(dayKey, log) {
  const entries = log.filter((e) => e.ts.slice(0, 10) === dayKey);
  const distinctDims = new Set(entries.flatMap((e) => e.dims || []));
  return Math.min(100, entries.length * 12 + distinctDims.size * 8);
}
function computeStreaks(log) {
  const days = [...new Set(log.map((e) => e.ts.slice(0, 10)))].sort();
  if (days.length === 0) return { current: 0, longest: 0 };
  let longest = 1, run = 1;
  for (let i = 1; i < days.length; i++) {
    const diff = (new Date(days[i]) - new Date(days[i - 1])) / 86400000;
    run = diff === 1 ? run + 1 : 1;
    longest = Math.max(longest, run);
  }
  const daySet = new Set(days);
  let current = 0;
  let cursor = new Date();
  if (!daySet.has(todayKey())) cursor = new Date(Date.now() - 86400000);
  while (daySet.has(cursor.toISOString().slice(0, 10))) {
    current++;
    cursor = new Date(cursor.getTime() - 86400000);
  }
  return { current, longest };
}
function dateSeed(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function getSuggestions(dimScores) {
  const sorted = [...DIM_DEFS].sort((a, b) => dimScores[a.key] - dimScores[b.key]);
  const seed = dateSeed(todayKey());
  return sorted.slice(0, 5).map((d, i) => {
    const catalog = ACTIVITY_CATALOG[d.key];
    const idx = (seed + i * 7) % catalog.length;
    return { label: catalog[idx], dims: [d.key], dimLabel: d.label };
  });
}
function loggedToday(log, label) {
  const tk = todayKey();
  return log.some((e) => e.label === label && e.ts.slice(0, 10) === tk);
}

function AvatarGlyph({ pct, dims, size = 260, version = 1 }) {
  const h = size, w = size * 0.78;
  const fillHeight = (h - 30) * (Math.max(0, Math.min(100, pct)) / 100);
  const cx = w / 2, cy = h * 0.5, radius = w * 0.46;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={size} style={{ maxWidth: w, display: "block", margin: "0 auto" }}>
      <defs>
        <linearGradient id="fillGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stopColor={C.violet} />
          <stop offset="100%" stopColor={C.signal} />
        </linearGradient>
        <clipPath id="devClip"><rect x="0" y={h - 20 - fillHeight} width={w} height={fillHeight + 20} /></clipPath>
      </defs>
      <g>
        <circle cx={w / 2} cy={h * 0.18} r={w * 0.16} fill="none" stroke={C.hairline} strokeWidth="1.5" />
        <path d={`M ${w * 0.28} ${h * 0.42} Q ${w / 2} ${h * 0.34} ${w * 0.72} ${h * 0.42} L ${w * 0.78} ${h - 22} Q ${w / 2} ${h - 4} ${w * 0.22} ${h - 22} Z`} fill="none" stroke={C.hairline} strokeWidth="1.5" />
      </g>
      <g clipPath="url(#devClip)">
        <circle cx={w / 2} cy={h * 0.18} r={w * 0.16} fill="url(#fillGrad)" opacity="0.9" />
        <path d={`M ${w * 0.28} ${h * 0.42} Q ${w / 2} ${h * 0.34} ${w * 0.72} ${h * 0.42} L ${w * 0.78} ${h - 22} Q ${w / 2} ${h - 4} ${w * 0.22} ${h - 22} Z`} fill="url(#fillGrad)" opacity="0.9" />
      </g>
      {dims.map((d, i) => {
        const angle = (i / dims.length) * Math.PI * 2 - Math.PI / 2;
        const r = radius + 14;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * (r * 1.05);
        const dotR = 2 + (d.score / 100) * 4;
        const t = d.score / 100;
        const dotColor = `rgba(${Math.round(140 + (84 - 140) * t)}, ${Math.round(126 + (214 - 126) * t)}, ${Math.round(242 + (199 - 242) * t)}, ${0.4 + t * 0.6})`;
        return <circle key={d.key} cx={x} cy={y} r={dotR} fill={dotColor} />;
      })}
      <text x={w / 2} y={h - 6} textAnchor="middle" fontSize="9" fill={C.textTertiary} fontFamily={MONO} letterSpacing="0.05em">v{version}</text>
    </svg>
  );
}

function PersonalDevelopmentOS() {
  const [status, setStatus] = useState("loading");
  const [data, setData] = useState(null);
  const [saveError, setSaveError] = useState(false);
  const [tab, setTab] = useState("home");
  const [showAddModal, setShowAddModal] = useState(false);
  const [resetArm, setResetArm] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(STORAGE_KEY);
        if (res && res.value) setData(JSON.parse(res.value));
        else { const fresh = defaultData(); setData(fresh); persist(fresh); }
      } catch (e) {
        const fresh = defaultData();
        setData(fresh);
        persist(fresh);
      } finally {
        setStatus("ready");
      }
    })();
    // eslint-disable-next-line
  }, []);

  async function persist(next) {
    try { const r = await storage.set(STORAGE_KEY, JSON.stringify(next)); setSaveError(!r); }
    catch (e) { setSaveError(true); }
  }
  function updateData(mutator) {
    setData((prev) => { const next = mutator(prev); persist(next); return next; });
  }
  function addLogEntry(label, dims, source = "suggested") {
    updateData((prev) => ({ ...prev, log: [...prev.log, { id: genId(), ts: new Date().toISOString(), label, dims, source }] }));
  }
  function removeTodayEntry(label) {
    const tk = todayKey();
    updateData((prev) => ({ ...prev, log: prev.log.filter((e) => !(e.label === label && e.ts.slice(0, 10) === tk)) }));
  }
  function toggleActivity(label, dims, source) {
    if (loggedToday(data.log, label)) removeTodayEntry(label);
    else addLogEntry(label, dims, source);
  }
  function addCustomActivity(label, dims, logNow) {
    updateData((prev) => {
      const activity = { id: genId(), label, dims };
      const customActivities = [...prev.customActivities, activity];
      let log = prev.log;
      if (logNow) log = [...log, { id: genId(), ts: new Date().toISOString(), label, dims, source: "custom" }];
      return { ...prev, customActivities, log };
    });
  }
  function setTargetIndex(val) { updateData((prev) => ({ ...prev, profile: { ...prev.profile, targetIndex: val } })); }
  function resetAll() { const fresh = defaultData(); setData(fresh); persist(fresh); setResetArm(false); }

  const dimScores = useMemo(() => {
    if (!data) return {};
    const now = new Date().toISOString();
    const obj = {};
    DIM_DEFS.forEach((d) => (obj[d.key] = scoreAsOf(d.key, now, data.log)));
    return obj;
  }, [data]);

  const dims = useMemo(() => {
    if (!data) return [];
    return DIM_DEFS.map((d) => {
      const score = dimScores[d.key];
      const weekAgo = scoreAsOf(d.key, isoDaysAgo(7), data.log);
      const monthAgo = scoreAsOf(d.key, isoDaysAgo(30), data.log);
      const sixMoAgo = scoreAsOf(d.key, isoDaysAgo(180), data.log);
      return { ...d, score, weekly: score - weekAgo, monthly: score - monthAgo, monthAgo, sixMoAgo };
    });
  }, [data, dimScores]);

  const avg = useMemo(() => (dims.length ? dims.reduce((s, d) => s + d.score, 0) / dims.length : 50), [dims]);
  const dimsWithStatus = useMemo(() => dims.map((d) => ({ ...d, status: d.score >= avg + 5 ? "strength" : d.score <= avg - 5 ? "weakness" : "balanced" })), [dims, avg]);
  const devIndex = avg;
  const devIndexMonthAgo = useMemo(() => {
    if (!data) return 50;
    return DIM_DEFS.reduce((s, d) => s + scoreAsOf(d.key, isoDaysAgo(30), data.log), 0) / DIM_DEFS.length;
  }, [data]);

  const weakest = useMemo(() => (dims.length ? [...dims].sort((a, b) => a.score - b.score)[0] : null), [dims]);
  const strongest = useMemo(() => (dims.length ? [...dims].sort((a, b) => b.score - a.score)[0] : null), [dims]);
  const fastestImproving = useMemo(() => (dims.length ? [...dims].sort((a, b) => b.monthly - a.monthly)[0] : null), [dims]);
  const streaks = useMemo(() => (data ? computeStreaks(data.log) : { current: 0, longest: 0 }), [data]);
  const suggestions = useMemo(() => (Object.keys(dimScores).length ? getSuggestions(dimScores) : []), [dimScores]);

  if (status === "loading") {
    return <div style={{ background: C.bg, minHeight: 400, fontFamily: SANS, color: C.textSecondary }} className="flex items-center justify-center text-sm">Loading your development data…</div>;
  }

  const NAV = [
    { key: "home", label: "Home", icon: "home" },
    { key: "develop", label: "Develop", icon: "grid" },
    { key: "progress", label: "Progress", icon: "barChart" },
    { key: "me", label: "Me", icon: "user" },
    { key: "insights", label: "Insights", icon: "compass" },
  ];

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: SANS, color: C.textPrimary }}>
      <div className="max-w-3xl mx-auto md:flex md:gap-6 md:py-6">
        <div className="hidden md:flex md:flex-col md:w-48 md:shrink-0 md:gap-1 md:h-fit md:sticky md:top-6">
          <div className="px-3 pb-4">
            <div className="text-sm font-semibold" style={{ letterSpacing: "-0.01em" }}>Development OS</div>
            <div className="mt-2"><SyncBadge saveError={saveError} onRetry={() => persist(data)} /></div>
          </div>
          {NAV.map((n) => {
            const active = tab === n.key;
            return (
              <button key={n.key} onClick={() => setTab(n.key)} className="flex items-center gap-3 px-3 py-2 rounded-xl text-sm transition"
                style={{ background: active ? C.surfaceRaised : "transparent", color: active ? C.textPrimary : C.textSecondary }}>
                <Icon name={n.icon} size={16} />{n.label}
              </button>
            );
          })}
        </div>

        <div className="flex-1 px-4 pt-6 pb-24 md:px-0 md:pb-6">
          {tab === "home" && <HomePage dims={dimsWithStatus} devIndex={devIndex} devIndexMonthAgo={devIndexMonthAgo} streaks={streaks} suggestions={suggestions} log={data.log} toggleActivity={toggleActivity} weakest={weakest} fastestImproving={fastestImproving} setTab={setTab} setShowAddModal={setShowAddModal} />}
          {tab === "develop" && <DevelopPage suggestions={suggestions} log={data.log} toggleActivity={toggleActivity} customActivities={data.customActivities} setShowAddModal={setShowAddModal} addLogEntry={addLogEntry} />}
          {tab === "progress" && <ProgressPage dims={dimsWithStatus} log={data.log} />}
          {tab === "me" && <MePage dims={dimsWithStatus} devIndex={devIndex} log={data.log} profile={data.profile} setTargetIndex={setTargetIndex} resetArm={resetArm} setResetArm={setResetArm} resetAll={resetAll} />}
          {tab === "insights" && <InsightsPage weakest={weakest} fastestImproving={fastestImproving} strongest={strongest} log={data.log} devIndex={devIndex} />}
        </div>
      </div>

      <div className="md:hidden fixed bottom-0 left-0 right-0 flex justify-around py-2" style={{ background: C.bgSoft, borderTop: `1px solid ${C.hairline}` }}>
        {NAV.map((n) => {
          const active = tab === n.key;
          return (
            <button key={n.key} onClick={() => setTab(n.key)} className="flex flex-col items-center gap-1 px-2 py-1">
              <Icon name={n.icon} size={18} color={active ? C.signal : C.textTertiary} />
              <span className="text-xs" style={{ color: active ? C.signal : C.textTertiary }}>{n.label}</span>
            </button>
          );
        })}
      </div>

      {showAddModal && <AddActivityModal onClose={() => setShowAddModal(false)} onSave={(label, dimsSel, logNow) => addCustomActivity(label, dimsSel, logNow)} />}
    </div>
  );
}

function CommunicationLab({ addLogEntry, log }) {
  const [prompt] = useState(SPEAKING_PROMPTS[dateSeed(todayKey()) % SPEAKING_PROMPTS.length]);
  const [seconds, setSeconds] = useState(60);
  const [running, setRunning] = useState(false);
  const [response, setResponse] = useState("");
  const [result, setResult] = useState(null);
  const timerRef = useRef(null);
  const label = "Impromptu speaking practice";
  const alreadyLogged = loggedToday(log, label);
  useEffect(() => {
    if (running && seconds > 0) timerRef.current = setTimeout(() => setSeconds((s) => s - 1), 1000);
    else if (seconds === 0) setRunning(false);
    return () => clearTimeout(timerRef.current);
  }, [running, seconds]);
  function evaluate() {
    const words = response.trim().split(/\s+/).filter(Boolean);
    const wordCount = words.length;
    const fillerCount = (response.match(/\b(um|uh|like|you know|basically)\b/gi) || []).length;
    const clarity = Math.max(35, Math.min(96, 55 + wordCount * 0.6 - fillerCount * 6));
    const structure = Math.max(35, Math.min(94, 45 + wordCount * 0.4));
    const vocabulary = Math.max(35, Math.min(95, 50 + new Set(words.map((w) => w.toLowerCase())).size * 1.1));
    const confidence = Math.max(35, Math.min(92, 60 - fillerCount * 8 + wordCount * 0.2));
    const overall = Math.round((clarity + structure + vocabulary + confidence) / 4);
    setResult({ clarity: Math.round(clarity), structure: Math.round(structure), vocabulary: Math.round(vocabulary), confidence: Math.round(confidence), overall });
    if (!alreadyLogged) addLogEntry(label, ["communication"], "lab");
  }
  return (
    <Card>
      <div className="flex items-center gap-2 mb-1"><Icon name="mic" size={16} color={C.violet} /><span className="text-sm font-medium">Communication lab · impromptu speaking</span></div>
      <p className="text-sm mt-2" style={{ color: C.textPrimary }}>"{prompt}"</p>
      <div className="flex items-center gap-3 mt-3">
        <span className="text-lg" style={{ fontFamily: MONO, color: seconds <= 10 ? C.danger : C.textPrimary }}>{String(Math.floor(seconds / 60)).padStart(2, "0")}:{String(seconds % 60).padStart(2, "0")}</span>
        <button onClick={() => { if (seconds === 0) setSeconds(60); setRunning((r) => !r); }} className="flex items-center gap-1 text-xs px-3 py-1.5 rounded-full" style={{ background: C.surfaceRaised, color: C.textPrimary, border: `1px solid ${C.hairline}` }}>
          <Icon name={running ? "square" : "play"} size={12} /> {running ? "Pause" : "Start"}
        </button>
      </div>
      <textarea value={response} onChange={(e) => setResponse(e.target.value)} placeholder="Type what you'd say (voice capture can be added later)…"
        className="w-full mt-3 text-sm rounded-xl p-3 outline-none" style={{ background: C.bgSoft, border: `1px solid ${C.hairline}`, color: C.textPrimary, minHeight: 80 }} />
      <button onClick={evaluate} disabled={!response.trim()} className="text-xs mt-3 px-3 py-1.5 rounded-full" style={{ background: response.trim() ? C.signalDim : "transparent", color: response.trim() ? C.signal : C.textTertiary, border: `1px solid ${response.trim() ? C.signal : C.hairline}` }}>Submit for evaluation</button>
      {result && (
        <div className="mt-4 pt-4" style={{ borderTop: `1px solid ${C.hairlineSoft}` }}>
          <div className="text-xs mb-2" style={{ color: C.textTertiary }}>Automated heuristic evaluation — logged as evidence for Communication ✓</div>
          <div className="text-sm mb-2">Score: <span style={{ fontFamily: MONO, color: C.signal }}>{result.overall}/100</span></div>
          {[["Clarity", result.clarity], ["Structure", result.structure], ["Vocabulary", result.vocabulary], ["Confidence", result.confidence]].map(([l, val]) => (
            <div key={l} className="flex items-center gap-2 mb-1.5">
              <span className="text-xs w-20" style={{ color: C.textSecondary }}>{l}</span>
              <div className="flex-1 h-1.5 rounded-full overflow-hidden" style={{ background: C.hairline }}><div className="h-full rounded-full" style={{ width: `${val}%`, background: C.signal }} /></div>
              <span className="text-xs w-6 text-right" style={{ fontFamily: MONO }}>{val}</span>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}

function BusinessLab({ addLogEntry, log }) {
  const [scenario] = useState(CASE_SCENARIOS[dateSeed(todayKey() + "b") % CASE_SCENARIOS.length]);
  const [response, setResponse] = useState("");
  const [result, setResult] = useState(null);
  const label = "Business case walkthrough";
  const alreadyLogged = loggedToday(log, label);
  function evaluate() {
    const words = response.trim().split(/\s+/).filter(Boolean);
    const wordCount = words.length;
    const reasoningWords = (response.match(/\b(because|therefore|so|hence)\b/gi) || []).length;
    const altWords = (response.match(/\b(alternative|instead|option|trade-off|tradeoff)\b/gi) || []).length;
    const riskWords = (response.match(/\b(risk|assumption|assume|downside)\b/gi) || []).length;
    const problemId = Math.max(35, Math.min(95, 45 + wordCount * 0.4));
    const logic = Math.max(35, Math.min(95, 50 + reasoningWords * 8));
    const alternatives = Math.max(35, Math.min(95, 45 + altWords * 10));
    const decisionQuality = Math.max(35, Math.min(95, 45 + riskWords * 9));
    const overall = Math.round((problemId + logic + alternatives + decisionQuality) / 4);
    setResult({ problemId: Math.round(problemId), logic: Math.round(logic), alternatives: Math.round(alternatives), decisionQuality: Math.round(decisionQuality), overall });
    if (!alreadyLogged) addLogEntry(label, ["business", "analytical"], "lab");
  }
  return (
    <Card>
      <div className="flex items-center gap-2 mb-1"><Icon name="briefcase" size={16} color={C.violet} /><span className="text-sm font-medium">Business case lab</span></div>
      <p className="text-sm mt-2" style={{ color: C.textPrimary }}>{scenario}</p>
      <textarea value={response} onChange={(e) => setResponse(e.target.value)} placeholder="Explain how you'd diagnose and approach this…"
        className="w-full mt-3 text-sm rounded-xl p-3 outline-none" style={{ background: C.bgSoft, border: `1px solid ${C.hairline}`, color: C.textPrimary, minHeight: 90 }} />
      <button onClick={evaluate} disabled={!response.trim()} className="text-xs mt-3 px-3 py-1.5 rounded-full" style={{ background: response.trim() ? C.signalDim : "transparent", color: response.trim() ? C.signal : C.textTertiary, border: `1px solid ${response.trim() ? C.signal : C.hairline}` }}>Submit for evaluation</button>
      {result && (
        <div className="mt-4 pt-4" style={{ borderTop: `1px solid ${C.hairlineSoft}` }}>
          <div className="text-xs mb-2" style={{ color: C.textTertiary }}>Automated heuristic evaluation — logged as evidence for Business & Analytical ✓</div>
          <div className="text-sm mb-2">Overall: <span style={{ fontFamily: MONO, color: C.signal }}>{result.overall}/100</span></div>
          {[["Problem identification", result.problemId], ["Logic", result.logic], ["Alternatives considered", result.alternatives], ["Decision quality", result.decisionQuality]].map(([l, val]) => (
            <div key={l} className="flex items-center gap-2 mb-1.5">

              <div className="flex-1 h-1.5 rounded-full overflow-hidden" style={{ background: C.hairline }}><div className="h-full rounded-full" style={{ width: `${val}%`, background: C.violet }} /></div>

function buildTrend(days, points, log) {
  const arr = [];
  for (let i = points - 1; i >= 0; i--) {
    const cutoff = new Date(Date.now() - i * (days / (points - 1)) * 86400000).toISOString();
    const avgVal = DIM_DEFS.reduce((s, d) => s + scoreAsOf(d.key, cutoff, log), 0) / DIM_DEFS.length;
    arr.push({ i: points - 1 - i, v: Math.round(avgVal * 10) / 10 });
  }
  return arr;
}

function ProgressPage({ dims, log }) {
  const [range, setRange] = useState("30D");
  const [selectedDim, setSelectedDim] = useState(dims[2]?.key || "communication");
  const [radarMode, setRadarMode] = useState("30d");
  const [selectedDay, setSelectedDay] = useState(null);
  const RANGE_CONF = { "7D": { days: 7, points: 8 }, "30D": { days: 30, points: 10 }, "3M": { days: 90, points: 12 }, "6M": { days: 180, points: 12 }, "1Y": { days: 365, points: 12 } };
  const trendData = useMemo(() => { const c = RANGE_CONF[range]; return buildTrend(c.days, c.points, log); }, [range, log]);
  const dim = dims.find((d) => d.key === selectedDim) || dims[0];
  const dimSeries = useMemo(() => {
    const arr = [];
    for (let i = 9; i >= 0; i--) { const cutoff = new Date(Date.now() - i * 3 * 86400000).toISOString(); arr.push({ i: 9 - i, v: scoreAsOf(dim.key, cutoff, log) }); }
    return arr;
  }, [dim, log]);
  const radarData = useMemo(() => dims.map((d) => ({ dimension: d.label.split(" ")[0], current: d.score, compare: radarMode === "30d" ? d.monthAgo : radarMode === "6mo" ? d.sixMoAgo : Math.min(98, d.score + 15) })), [dims, radarMode]);
  const heatmap = useMemo(() => {
    const out = [];
    for (let i = 34; i >= 0; i--) {
      const day = new Date(Date.now() - i * 86400000);
      const dk = day.toISOString().slice(0, 10);
      const entries = log.filter((e) => e.ts.slice(0, 10) === dk);
      const distinct = new Set(entries.flatMap((e) => e.dims || []));
      out.push({ dk, intensity: Math.min(4, distinct.size), dayScore: dayScoreFor(dk, log), entries });
    }
    return out;
  }, [log]);
  const heatColors = [C.hairlineSoft, "rgba(84,214,199,0.22)", "rgba(84,214,199,0.42)", "rgba(84,214,199,0.65)", C.signal];
  const records = useMemo(() => {
    const streaks = computeStreaks(log);
    const byDim = {};
    log.forEach((e) => (e.dims || []).forEach((dk) => (byDim[dk] = (byDim[dk] || 0) + 1)));
    let topDim = null, topDimCount = 0;
    Object.entries(byDim).forEach(([k, v]) => { if (v > topDimCount) { topDim = k; topDimCount = v; } });
    const days = [...new Set(log.map((e) => e.ts.slice(0, 10)))];
    let bestDay = null, bestScore = -1;
    days.forEach((dk) => { const s = dayScoreFor(dk, log); if (s > bestScore) { bestScore = s; bestDay = dk; } });
    return { longestStreak: streaks.longest, currentStreak: streaks.current, topDim, bestScore: Math.max(0, bestScore), totalLogged: log.length };
  }, [log]);
  const history = useMemo(() => {
    const items = [];
    if (log.length > 0) {
      const sorted = [...log].sort((a, b) => new Date(a.ts) - new Date(b.ts));
      items.push({ date: sorted[0].ts, label: "Started development journey" });
      const seenDims = new Set();
      const dayKeys = [...new Set(sorted.map((e) => e.ts.slice(0, 10)))].sort();
      let run = 1;
      const thresholds = [7, 14, 30, 60, 100];
      const hit = new Set();
      for (let i = 0; i < dayKeys.length; i++) {
        if (i > 0) { const diff = (new Date(dayKeys[i]) - new Date(dayKeys[i - 1])) / 86400000; run = diff === 1 ? run + 1 : 1; }
        thresholds.forEach((th) => { if (run === th && !hit.has(th)) { hit.add(th); items.push({ date: dayKeys[i] + "T00:00:00.000Z", label: `${th}-day streak reached` }); } });
      }
      sorted.forEach((e) => (e.dims || []).forEach((dk) => { if (!seenDims.has(dk)) { seenDims.add(dk); items.push({ date: e.ts, label: `First activity logged for ${DIM_LABEL[dk]}` }); } }));
    }
    return items.sort((a, b) => new Date(a.date) - new Date(b.date));
  }, [log]);
  return (
    <div className="flex flex-col gap-4">
      <SectionHeading title="Progress" sub="Statistical development over time, computed from your logged activity." />
      <Card>
        <span className="text-sm font-medium">Overall development trend</span>
        <div className="flex gap-2 mt-3 mb-3 flex-wrap">{Object.keys(RANGE_CONF).map((r) => <Pill key={r} active={range === r} onClick={() => setRange(r)}>{r}</Pill>)}</div>
        <MiniLineChart data={trendData} color={C.signal} height={180} />
      </Card>
      <Card>
        <span className="text-sm font-medium">Dimension progress</span>
        <div className="flex gap-2 mt-3 mb-3 flex-wrap">{dims.map((d) => <Pill key={d.key} active={selectedDim === d.key} onClick={() => setSelectedDim(d.key)}>{d.label.split(" ")[0]}</Pill>)}</div>
        <MiniLineChart data={dimSeries} color={C.violet} height={140} />
        <div className="grid grid-cols-3 gap-2 mt-3">
          {[["This week", dim.weekly], ["This month", dim.monthly], ["6 months", dim.score - dim.sixMoAgo]].map(([l, val]) => (
            <div key={l} className="text-center">
              <div className="text-xs" style={{ color: C.textTertiary }}>{l}</div>
              <div className="text-sm mt-0.5" style={{ fontFamily: MONO, color: val >= 0 ? C.signal : C.danger }}>{val >= 0 ? "+" : ""}{val}</div>
            </div>
          ))}
        </div>
      </Card>
      <Card>
        <span className="text-sm font-medium">Development radar</span>
        <div className="flex gap-2 mt-3 mb-2 flex-wrap">
          <Pill active={radarMode === "30d"} onClick={() => setRadarMode("30d")}>Today vs 30 days ago</Pill>
          <Pill active={radarMode === "6mo"} onClick={() => setRadarMode("6mo")}>Today vs 6 months ago</Pill>
          <Pill active={radarMode === "target"} onClick={() => setRadarMode("target")}>Current vs target</Pill>
        </div>
        <MiniRadarChart data={radarData} size={280} />
      </Card>
      <Card>
        <span className="text-sm font-medium">Development heatmap</span>
        <div className="grid grid-cols-7 gap-1 mt-3">
          {heatmap.map((d) => <button key={d.dk} onClick={() => setSelectedDay(d)} className="aspect-square rounded" style={{ background: heatColors[d.intensity], outline: selectedDay?.dk === d.dk ? `1px solid ${C.signal}` : "none" }} />)}
        </div>
        {selectedDay && (
          <div className="mt-3 pt-3 text-sm" style={{ borderTop: `1px solid ${C.hairlineSoft}` }}>
            <div className="flex justify-between"><span style={{ fontFamily: MONO }}>{selectedDay.dk}</span><button onClick={() => setSelectedDay(null)}><Icon name="x" size={14} color={C.textTertiary} /></button></div>
            <div className="text-xs mt-1" style={{ color: C.textSecondary }}>Day score: {selectedDay.dayScore} · {selectedDay.entries.length} activities logged</div>
            {selectedDay.entries.length > 0 && <div className="text-xs mt-1" style={{ color: C.textSecondary }}>{selectedDay.entries.map((e) => e.label).join(", ")}</div>}
          </div>
        )}
      </Card>
      <Card>
        <span className="text-sm font-medium">My records</span>
        <div className="grid grid-cols-2 gap-3 mt-3 text-sm">
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Longest streak</div><div style={{ fontFamily: MONO }}>{records.longestStreak} days</div></div>
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Current streak</div><div style={{ fontFamily: MONO }}>{records.currentStreak} days</div></div>
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Best day score</div><div style={{ fontFamily: MONO }}>{records.bestScore}</div></div>
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Most-logged area</div><div>{records.topDim ? DIM_LABEL[records.topDim] : "—"}</div></div>
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Total activities logged</div><div style={{ fontFamily: MONO }}>{records.totalLogged}</div></div>
        </div>
      </Card>
      <Card>
        <span className="text-sm font-medium">Development history</span>
        <div className="flex flex-col mt-3">
          {history.length === 0 && <div className="text-sm" style={{ color: C.textSecondary }}>Milestones will appear here as you log activity.</div>}
          {history.map((h, i) => (
            <div key={h.label + h.date} className="flex gap-3">
              <div className="flex flex-col items-center">
                <div className="w-2 h-2 rounded-full" style={{ background: C.signal }} />
                {i < history.length - 1 && <div className="w-px flex-1" style={{ background: C.hairline }} />}
              </div>
              <div className="pb-4">
                <div className="text-xs" style={{ color: C.textTertiary, fontFamily: MONO }}>{new Date(h.date).toLocaleDateString()}</div>
                <div className="text-sm" style={{ color: C.textPrimary }}>{h.label}</div>
              </div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

        <div className="grid grid-cols-2 gap-3 mt-3 text-sm">
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Starting score</div><div style={{ fontFamily: MONO }}>{startScore.toFixed(1)}</div></div>
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Current score</div><div style={{ fontFamily: MONO, color: C.signal }}>{devIndex.toFixed(1)}</div></div>
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Growth</div><div style={{ fontFamily: MONO, color: C.signal }}>{growthPct}%</div></div>
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Active days</div><div style={{ fontFamily: MONO }}>{activeDaysThisMonth}</div></div>
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Biggest improvement</div><div>{fastestImproving.label}</div></div>
          <div><div className="text-xs" style={{ color: C.textTertiary }}>Biggest gap</div><div>{weakest.label}</div></div>
        </div>
        <div className="flex gap-2 mt-3"><span className="text-xs px-2 py-1 rounded-full" style={{ background: C.violetDim, color: C.violet }}>Next priority: {weakest.label}</span></div>
      </Card>
    </div>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<PersonalDevelopmentOS />);
} catch (e) {
  showError("Render error: " + (e && e.message ? e.message : e));
}
</script>
</body>
</html>
